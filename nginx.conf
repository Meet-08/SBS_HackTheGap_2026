events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    upstream frontend_upstream {
        server sbs_frontend:5173;
    }

    upstream backend_upstream {
        server sbs_backend:8080;
    }

    server {
        listen 80;
        server_name _;

        location / {
            set $frontend_service "http://frontend_upstream";

            proxy_pass $frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            set $backend_service "http://backend_upstream";

            proxy_pass $backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle OAuth2 Redirection and Callbacks
        location ~ ^/(oauth2|login/oauth2)/ {
            set $backend_service "http://backend_upstream";
            proxy_pass $backend_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Important for OAuth: Ensure cookies/headers are preserved
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}