# nginx.conf
events {}

http {
    upstream frontend {
        server sbs_frontend:5173;
    }

    upstream backend {
        server sbs_backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # Frontend
        location / {
            proxy_pass http://frontend; # Removed trailing slash for cleaner routing
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend - DO NOT strip the /api/ prefix
        location /api/ {
            proxy_pass http://backend; # No trailing slash here passes the full path
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}