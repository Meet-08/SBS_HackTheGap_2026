name: Docker Build and Push
description: Build and push a Docker image for a service

inputs:
  context:
    description: "Build context directory"
    required: true
  image:
    description: "Docker image name (without registry)"
    required: true
  dockerhub-username:
    description: "DockerHub username"
    required: true
  dockerhub-token:
    description: "DockerHub token"
    required: true
  build-args:
    description: "Multiline list of Docker build args (KEY=VALUE)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        push: true
        build-args: ${{ inputs.build-args }}
        tags: |
          ${{ inputs.dockerhub-username }}/${{ inputs.image }}:latest
          ${{ inputs.dockerhub-username }}/${{ inputs.image }}:${{ github.sha }}
