services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=sbs'
      - 'POSTGRES_PASSWORD=1234'
      - 'POSTGRES_USER=meet'
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - '5432:5432'

  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  pg_data:
  redis_data: